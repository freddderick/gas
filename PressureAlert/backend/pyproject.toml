[project]
name = "pressure-backend"
version = "0.1.0"
description = "Polls Open-Meteo sea-level pressure, evaluates per-install thresholds, and sends APNs alerts."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx[http2]>=0.27",
    "pyjwt>=2.8",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pressure-backend = "pressure_backend.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pressure_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
