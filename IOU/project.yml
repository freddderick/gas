name: IOU
options:
  bundleIdPrefix: ca.andywood
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  IOU:
    type: application
    platform: iOS
    sources:
      - path: IOU
    info:
      path: IOU/Resources/Info.plist
      properties:
        CFBundleDisplayName: IOU
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryUsageDescription: "IOU scans your photo library to find receipts, so it can build a searchable gallery of your purchases. Photos are analyzed on your device only."
        NSPhotoLibraryAddUsageDescription: "IOU can save exported receipt images back to your photo library."
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.andywood.IOU
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  IOUTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IOUTests
    dependencies:
      - target: IOU
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.andywood.IOUTests
schemes:
  IOU:
    build:
      targets:
        IOU: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IOUTests
    archive:
      config: Release
